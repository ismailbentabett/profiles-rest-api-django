<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Profiles REST API</title>
  <desc id="desc">User profiles API foundation built on Django REST Framework</desc>
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="24"/>
    </clipPath>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C4B33" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#0C4B33" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#44B78B" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C4B33"/>
      <stop offset="1" stop-color="#44B78B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0B0F19"/>
    <rect width="1280" height="400" fill="url(#wash)"/>
    <rect width="1280" height="400" fill="url(#grid)" opacity="0.05"/>

    <!-- logo mark -->
    <g transform="translate(96 100) scale(0.78125)">
      <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
      <path d="M88 64 C68 64 64 74 64 90 V112 C64 122 58 128 48 128 C58 128 64 134 64 144 V166 C64 182 68 192 88 192" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M168 64 C188 64 192 74 192 90 V112 C192 122 198 128 208 128 C198 128 192 134 192 144 V166 C192 182 188 192 168 192" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="128" cy="106" r="22" fill="#FFFFFF"/>
      <path d="M90 176 C90 152 108 140 128 140 C148 140 166 152 166 176 Z" fill="#FFFFFF"/>
    </g>

    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="340" y="178" font-size="68" font-weight="800" fill="#FFFFFF">Profiles REST API</text>
      <text x="342" y="226" font-size="26" fill="#A1A8B8">User profiles API foundation on Django REST Framework</text>

      <g font-size="17" font-weight="600" fill="#E6E9F0">
        <rect x="342" y="258" width="104" height="36" rx="18" fill="none" stroke="#44B78B" stroke-width="1"/>
        <text x="394" y="282" text-anchor="middle">Python</text>
        <rect x="458" y="258" width="118" height="36" rx="18" fill="none" stroke="#44B78B" stroke-width="1"/>
        <text x="517" y="282" text-anchor="middle">Django 3.1</text>
        <rect x="588" y="258" width="190" height="36" rx="18" fill="none" stroke="#44B78B" stroke-width="1"/>
        <text x="683" y="282" text-anchor="middle">REST Framework</text>
        <rect x="790" y="258" width="104" height="36" rx="18" fill="none" stroke="#44B78B" stroke-width="1"/>
        <text x="842" y="282" text-anchor="middle">SQLite</text>
      </g>
    </g>
  </g>
</svg>
